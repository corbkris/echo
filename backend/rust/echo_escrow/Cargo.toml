[package]
name = "echo_escrow"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "escrow_api"
path = "api/main.rs"

[dependencies]

bitcoin = {version = "0.32.5", features = ["rand","serde"]}

secp256k1 = {version = "0.30.0", features = ["rand"] }

sha2 = {version = "0.10.9"}

rand = {version = "0.9.0"}

serde = {version = "1.0"}

reqwest = { version = "0.12.15", features = ["json", "blocking", "rustls-tls"] }

tokio = { version = "1", features = ["full"] }

bip39 = {version = "2.1.0", features = ["rand"]}

bip32 = {version = "0.5.3", features = ["secp256k1"]}

hdpath = {version = "0.7.0"}

ripemd = {version = "0.1"}

bs58 = {version = "0.5.1"}

